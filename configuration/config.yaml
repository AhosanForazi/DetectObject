project:
  name: DetectObject
  version: 1.0.0
  description: AI-Powered Real-Time Object Detection, Tracking, and Counting System

model:
  default_weights: models/weights/best.pt
  fallback_weights: models/weights/yolo11n.pt
  architecture: yolo11n
  open_vocab_weights: models/weights/yolov8s-worldv2.pt
  device: auto  # auto, cpu, cuda, mps
  imgsz: 480
  confidence_threshold: 0.35
  iou_threshold: 0.45
  max_detections: 100
  half_precision: false

tracking:
  enabled: true
  tracker_type: bytetrack  # bytetrack or botsort
  persist: true
  max_age_frames: 30
  track_history_length: 30
  show_trails: true

counting:
  line_enabled: false
  line_orientation: horizontal  # horizontal or vertical
  line_position: 0.5  # normalized 0.0 - 1.0
  roi_enabled: false
  roi_box: [0.15, 0.15, 0.85, 0.85]  # [x1, y1, x2, y2] normalized

webcam:
  default_camera_index: 0
  frame_width: 640
  frame_height: 480
  target_fps: 30
  frame_skip: 1
  inference_imgsz: 320
  screenshot_dir: outputs/screenshots

video:
  frame_skip: 1
  max_dimension: 1280
  output_dir: outputs/videos
  codec: h264

image:
  output_dir: outputs/images
  allowed_extensions: [jpg, jpeg, png, webp]

dataset:
  name: coco128
  source_url: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip
  license: "COCO Annotations: CC BY 4.0; Images: Flickr Terms of Use (via Ultralytics COCO128)"
  raw_dir: datasets/raw
  processed_dir: datasets/processed
  manifests_dir: datasets/manifests
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

training:
  base_model: yolo11n.pt
  epochs: 8
  batch_size: auto  # auto picks safe batch size from RAM/VRAM
  imgsz: 320
  optimizer: SGD
  learning_rate: 0.0003
  warmup_bias_lr: 0.001
  warmup_epochs: 1.0
  freeze_layers: 10
  weight_decay: 0.0005
  patience: 6
  seed: 42
  workers: 0  # safe for Windows low-RAM CPU
  project_dir: logs/training
  run_name: detectobject_yolo11n
  best_weights_dest: models/weights/best.pt

evaluation:
  reports_dir: reports
  conf_threshold: 0.25
  iou_threshold: 0.50
  benchmark_iterations: 20

ui:
  theme: light  # light and clean default
  page_title: DetectObject — AI Real-Time Object Detection
  default_open_vocab_prompts:
    - person
    - laptop
    - smartphone
    - water bottle
    - helmet
    - bag
    - chair
    - bicycle
    - dog
    - cat
